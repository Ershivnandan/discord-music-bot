# Run the whole stack on the server with:  docker compose up -d --build
# DISCORD_TOKEN comes from a .env file next to this compose file.
services:
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      POT_PROVIDER_URL: http://pot-provider:4416
      # Route yt-dlp egress through Cloudflare WARP to bypass datacenter IP blocks
      YTDLP_PROXY: socks5://warp:1080
    ports:
      - "8080:8080" # health endpoint
    depends_on:
      - pot-provider
      - warp

  # Generates YouTube PO tokens so downloads pass the bot-check that
  # YouTube gives datacenter IPs. Native multi-arch image (ARM64 + AMD64).
  pot-provider:
    image: ghcr.io/jim60105/bgutil-pot:latest
    restart: unless-stopped
    command: server --host 0.0.0.0 --port 4416

  # Cloudflare WARP SOCKS5 proxy sidecar: routes outbound YouTube and googlevideo
  # streams through Cloudflare's residential-reputation network, eliminating
  # datacenter ASN bot-check and HTTP 403 Forbidden blocks.
  warp:
    image: caomingjun/warp:latest
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=0
    environment:
      - WARP_SLEEP=2

