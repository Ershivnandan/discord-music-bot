[project]
name = "discord-music-bot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ershivnandan", email = "shivnandansoni64@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.14.3",
    "bgutil-ytdlp-pot-provider>=1.3.2",
    "discord-py[voice]>=2.7.1",
    "python-dotenv>=1.2.3",
    "yt-dlp>=2026.8.19",
    "yt-dlp-ejs>=0.8.0",
]

[project.scripts]
discord-music-bot = "discord_music_bot:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"
