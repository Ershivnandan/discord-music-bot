name: Deploy to Oracle VM

on:
  push:
    branches: [master]
  workflow_dispatch: {} # allows manual "Run workflow" from the Actions tab

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: opc # Oracle Linux default user
          key: ${{ secrets.ORACLE_SSH_KEY }}
          # The VM needs one-time setup first: docker installed, repo cloned
          # at ~/bot, and the token in ~/bot.env (see README)
          script: |
            cd ~/bot
            git pull --ff-only
            docker compose version >/dev/null 2>&1 || sudo dnf install -y docker-compose-plugin
            ln -sf ~/bot.env ~/bot/.env
            docker rm -f music-bot 2>/dev/null || true # old pre-compose container
            docker compose up -d --build
            docker image prune -f
